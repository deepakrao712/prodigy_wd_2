<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Digital Watch</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 1s;
      color: #fff;
    }

    .day {
      background: linear-gradient(#87ceeb, #fdfdfd);
    }

    .night {
      background: linear-gradient(#0f2027, #203a43, #2c5364);
    }

    .watch-bg {
      width: 270px;
      height: 270px;
      background: radial-gradient(circle at center, #111 60%, #333);
      border-radius: 50%;
      border: 10px solid #4e4e4e;
      box-shadow:
        0 0 20px rgba(0, 255, 0, 0.4),
        inset 0 0 15px #0f0,
        0 4px 12px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
    }

    .glass {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.2), transparent 60%);
      border-radius: 50%;
      pointer-events: none;
    }

    #display {
      font-size: 1.6rem;
      background: #000;
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: inset 0 0 10px #0f0;
      color: #0f0;
      z-index: 1;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      background-color: #1e1e1e;
      color: #0f0;
      border: 2px solid #0f0;
      border-radius: 6px;
      padding: 10px 15px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background-color: #0f0;
      color: #000;
    }

    .lap-list {
      width: 90%;
      max-width: 400px;
      max-height: 150px;
      overflow-y: auto;
      margin-top: 20px;
      font-family: monospace;
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 10px;
      border: 1px solid #0f0;
    }

    .lap-list li {
      margin: 4px 0;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="watch-bg">
    <div id="display">00:00:00.00</div>
    <div class="glass"></div>
  </div>

  <div class="controls">
    <button onclick="playSound();start()">Start</button>
    <button onclick="playSound();pause()">Pause</button>
    <button onclick="playSound();lap()">Lap</button>
    <button onclick="playSound();reset()">Reset</button>
  </div>

  <ul class="lap-list" id="laps"></ul>

  <audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-29.mp3" preload="auto"></audio>

  <script>
    let startTime = 0;
    let elapsedTime = 0;
    let timerInterval = null;
    let lapTime = 0;
    let lapCount = 1;

    function format(ms) {
      const date = new Date(ms);
      const h = String(date.getUTCHours()).padStart(2, '0');
      const m = String(date.getUTCMinutes()).padStart(2, '0');
      const s = String(date.getUTCSeconds()).padStart(2, '0');
      const cs = String(Math.floor(date.getUTCMilliseconds() / 10)).padStart(2, '0');
      return `${h}:${m}:${s}.${cs}`;
    }

    function updateDisplay() {
      document.getElementById('display').textContent = format(elapsedTime);
    }

    function start() {
      if (!timerInterval) {
        startTime = Date.now() - elapsedTime;
        timerInterval = setInterval(() => {
          elapsedTime = Date.now() - startTime;
          updateDisplay();
        }, 10);
      }
    }

    function pause() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function reset() {
      clearInterval(timerInterval);
      timerInterval = null;
      elapsedTime = 0;
      lapTime = 0;
      lapCount = 1;
      updateDisplay();
      document.getElementById("laps").innerHTML = '';
    }

    function lap() {
      if (timerInterval) {
        const lapNow = elapsedTime;
        const lapDuration = lapNow - lapTime;
        const lapText = `Lap ${lapCount++}: ${format(lapDuration)} (Total: ${format(lapNow)})`;
        const li = document.createElement("li");
        li.textContent = lapText;
        document.getElementById("laps").prepend(li);
        lapTime = lapNow;
      }
    }

    function playSound() {
      document.getElementById('clickSound').play();
    }

    function setBackground() {
      const hour = new Date().getHours();
      if (hour >= 6 && hour < 18) {
        document.body.classList.add("night");
        document.body.classList.remove("day");
      } else {
        document.body.classList.add("day");
        document.body.classList.remove("night");
      }
    }

    setBackground();
  </script>
</body>
</html>
