<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Digital Watch</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="watch-bg">
    <div id="display">00:00:00.00</div>
    <div class="glass"></div>
  </div>

  <div class="controls">
    <button onclick="playSound();start()">Start</button>
    <button onclick="playSound();pause()">Pause</button>
    <button onclick="playSound();lap()">Lap</button>
    <button onclick="playSound();reset()">Reset</button>
  </div>

  <ul class="lap-list" id="laps"></ul>

  <audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-29.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
